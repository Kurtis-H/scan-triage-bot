[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-triage-bot"
version = "0.1.0"
description = "Merge ZAP, Trivy and SARIF security reports into one deduplicated, ranked, explainable list."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
scan-triage = "scan_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long strings in sample scanner data and test fixtures.
"examples/*" = ["E501"]
"tests/*" = ["E501"]
